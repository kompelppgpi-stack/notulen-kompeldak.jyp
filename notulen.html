<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WEB NOTULEN PRO</title>

<style>
body { font-family: Arial; background:#f0f2f5; padding:20px; }
.container { max-width:1000px; margin:auto; background:white; padding:20px; border-radius:10px; box-shadow:0 0 15px rgba(0,0,0,0.1);}
button { padding:10px 15px; margin:5px; border:none; border-radius:5px; cursor:pointer; font-weight:bold;}
.live { background:green; color:white;}
.stop { background:red; color:white;}
.upload { background:#003366; color:white;}
.format { background:#006600; color:white;}
.berita { background:#cc7a00; color:white;}
.atensi { background:#990000; color:white;}
textarea { width:100%; height:300px; margin-top:10px; padding:10px;}
.status { font-weight:bold; margin-top:10px;}
</style>
</head>

<body>
<div class="container">
<h2>WEB NOTULEN & TRANSKRIPSI RAPAT</h2>

<h3>🎤 Live Suara ke Teks</h3>
<button class="live" onclick="startLive()">Mulai Live</button>
<button class="stop" onclick="stopLive()">Stop</button>
<div class="status" id="status">Status: Tidak merekam</div>

<h3>📂 Upload MP3 ke Teks</h3>
<input type="file" id="audioFile" accept=".mp3,.wav">
<button class="upload" onclick="uploadAudio()">Upload & Convert</button>

<h3>Hasil Transkripsi</h3>
<textarea id="hasil"></textarea>

<h3>📄 Format Otomatis</h3>
<button class="format" onclick="formatNotulen()">Notulen Resmi</button>
<button class="berita" onclick="buatBerita()">Berita Rilis</button>
<button class="atensi" onclick="buatAtensi()">Laporan Atensi Pimpinan</button>
</div>

<script>
/* ================= LIVE SPEECH ================= */
let recognition;
let isRecording = false;

function initSpeech() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        alert("Gunakan Google Chrome terbaru.");
        return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = "id-ID";
    recognition.continuous = true;
    recognition.interimResults = false;

    recognition.onstart = () => {
        document.getElementById("status").innerText = "Status: 🎤 Merekam...";
    };

    recognition.onresult = (event) => {
        let text = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
            text += event.results[i][0].transcript + " ";
        }
        document.getElementById("hasil").value += text;
    };

    recognition.onend = () => {
        if (isRecording) recognition.start();
        else document.getElementById("status").innerText = "Status: Tidak merekam";
    };
}

function startLive() {
    if (!recognition) initSpeech();
    isRecording = true;
    recognition.start();
}

function stopLive() {
    isRecording = false;
    if (recognition) recognition.stop();
}

/* ================= UPLOAD MP3 ================= */
async function uploadAudio() {
    const file = document.getElementById("audioFile").files[0];
    if (!file) return alert("Pilih file MP3.");

    document.getElementById("hasil").value = "Memproses audio...";

    const response = await fetch("https://api-inference.huggingface.co/models/openai/whisper-large-v3", {
        method: "POST",
        headers: {
            "Authorization": "Bearer hf_ISI_TOKEN_ANDA"
        },
        body: file
    });

    const result = await response.json();
    document.getElementById("hasil").value = result.text || "Gagal memproses.";
}

/* ================= FORMAT NOTULEN ================= */
function formatNotulen() {
    const isi = document.getElementById("hasil").value;

    document.getElementById("hasil").value =
`NOTULEN RAPAT

I. Waktu dan Tempat
-

II. Pimpinan Rapat
-

III. Peserta
-

IV. Agenda dan Pembahasan
${isi}

V. Kesimpulan
-

VI. Tindak Lanjut
-`;
}

/* ================= FORMAT BERITA ================= */
function buatBerita() {
    const isi = document.getElementById("hasil").value;

    document.getElementById("hasil").value =
`Papua, INFO_DITJENPAS PAPUA — 

Dalam kegiatan yang dilaksanakan hari ini, jajaran membahas sejumlah agenda strategis terkait pelaksanaan tugas dan fungsi pemasyarakatan.

${isi}

Kegiatan tersebut diharapkan mampu meningkatkan kualitas pelayanan publik serta memperkuat integritas dan profesionalisme jajaran.`;
}

/* ================= FORMAT ATENSI ================= */
function buatAtensi() {
    const isi = document.getElementById("hasil").value;

    document.getElementById("hasil").value =
`LAPORAN ATENSI PIMPINAN

Yth.
1. Sekretaris Jenderal
2. Direktur Jenderal
3. Sekretaris Ditjen

I. KEGIATAN
Transkripsi hasil kegiatan sebagai berikut:
${isi}

II. ANALISIS
-

III. REKOMENDASI
-`;
}
</script>
</body>
</html>
